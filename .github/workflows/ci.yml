name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when new commits are pushed to the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # The job name "check" is the required status check in the main branch ruleset.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Postgres for this run, matching compose.yaml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hanahire
          POSTGRES_PASSWORD: hanahire
          POSTGRES_DB: hanahire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hanahire -d hanahire"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://hanahire:hanahire@localhost:5432/hanahire
      # Placeholders: CI builds and tests the app but never completes a real OAuth sign-in.
      BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GITHUB_CLIENT_ID: test-github-client-id
      GITHUB_CLIENT_SECRET: test-github-client-secret
      ALLOWED_EMAILS: dev@example.com
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them updated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Also runs `prisma generate` via the postinstall script.
      - run: pnpm install --frozen-lockfile

      # Proves the committed migrations apply cleanly to an empty database.
      - run: pnpm db:deploy

      - run: pnpm check
